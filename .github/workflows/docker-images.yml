name: build-docker-images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker-images.yml'
      - 'server/**'
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - '.github/workflows/docker-images.yml'
              - 'server/**'
            web:
              - '.github/workflows/docker-images.yml'
              - 'web/**'

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/fairpushy-server
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/fairpushy-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip unchanged image
        if: ${{ (matrix.name == 'server' && needs.changes.outputs.server != 'true') || (matrix.name == 'web' && needs.changes.outputs.web != 'true') }}
        run: |
          echo "Skip ${{ matrix.name }} because no related files changed."
          exit 0

      - name: Setup Docker Buildx
        if: ${{ (matrix.name == 'server' && needs.changes.outputs.server == 'true') || (matrix.name == 'web' && needs.changes.outputs.web == 'true') }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ (matrix.name == 'server' && needs.changes.outputs.server == 'true') || (matrix.name == 'web' && needs.changes.outputs.web == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ (matrix.name == 'server' && needs.changes.outputs.server == 'true') || (matrix.name == 'web' && needs.changes.outputs.web == 'true') }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        if: ${{ (matrix.name == 'server' && needs.changes.outputs.server == 'true') || (matrix.name == 'web' && needs.changes.outputs.web == 'true') }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
